  <style>
:root {
  --ma-paper: #f5f0e6; --ma-paper-2: #ece4d3; --ma-ink: #1f1a14;
  --ma-ink-soft: rgba(31,26,20,.66); --ma-ink-faint: rgba(31,26,20,.42);
  --ma-rule: rgba(31,26,20,.16); --ma-accent: #7a1f17;
  --ma-display: 'Newsreader', Georgia, serif;
  --ma-body: 'IBM Plex Sans', system-ui, sans-serif;
  --ma-mono: 'IBM Plex Mono', ui-monospace, monospace;
  --ma-body-size: 15.5px; --ma-leading: 1.62;
}
@media (prefers-color-scheme: dark) {
  :root.auto-theme {
    --ma-paper: #1b1714; --ma-paper-2: #25201b; --ma-ink: #f1ebdf;
    --ma-ink-soft: rgba(241,235,223,.7); --ma-ink-faint: rgba(241,235,223,.42);
    --ma-rule: rgba(241,235,223,.18); --ma-accent: #e89a8f;
  }
}
* { box-sizing: border-box; } html, body { margin: 0; padding: 0; }
body { font-family: var(--ma-body); color: var(--ma-ink); background: var(--ma-paper); font-size: var(--ma-body-size); line-height: var(--ma-leading); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
.ma-nav { display: flex; align-items: baseline; justify-content: space-between; padding: 22px 48px 18px; border-bottom: .5px solid var(--ma-rule); gap: 24px; flex-wrap: wrap; }
.ma-mark { font-family: var(--ma-display); font-style: italic; font-size: 22px; letter-spacing: -0.01em; color: var(--ma-ink); text-decoration: none; }
.ma-mark .ma-dot { color: var(--ma-accent); font-style: normal; }
.ma-nav-links { display: flex; gap: 24px; font-family: var(--ma-mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; align-items: center; }
.ma-nav-links a { text-decoration: none; color: var(--ma-ink-soft); padding: 4px 0; border-bottom: 1px solid transparent; transition: color .15s, border-color .15s; }
.ma-nav-links a:hover { color: var(--ma-ink); }
.ma-nav-links a.active { color: var(--ma-accent); border-bottom-color: var(--ma-accent); }
.ma-cv-pill { font-family: var(--ma-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 6px 12px; border: .5px solid var(--ma-ink); border-radius: 999px; text-decoration: none; color: var(--ma-ink); transition: background .15s, color .15s; }
.ma-cv-pill:hover { background: var(--ma-ink); color: var(--ma-paper); }
.ma-nav-drop { position: relative; }
.ma-nav-drop > span { cursor: pointer; color: var(--ma-ink-soft); font-family: var(--ma-mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; padding: 4px 0; display: flex; align-items: center; gap: 5px; transition: color .15s; }
.ma-nav-drop:hover > span { color: var(--ma-ink); }
.ma-nav-drop > span::after { content: '▾'; font-size: 9px; opacity: .7; }
.ma-nav-drop-menu { display: none; position: absolute; top: calc(100% + 10px); left: -16px; background: var(--ma-paper-2); border: .5px solid var(--ma-rule); padding: 6px 0; min-width: 150px; z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.ma-nav-drop.open .ma-nav-drop-menu { display: block; }
.ma-nav-drop-menu a { display: block; padding: 8px 16px; text-decoration: none; color: var(--ma-ink-soft); font-family: var(--ma-mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; border-bottom: none; transition: color .15s, background .15s; }
.ma-nav-drop-menu a:hover { color: var(--ma-accent); background: var(--ma-paper-2); }
.ma-page { max-width: 900px; margin: 0 auto; padding: 56px 48px 100px; }
.ma-hero-eyebrow { display: flex; align-items: center; gap: 16px; font-family: var(--ma-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ma-ink-faint); margin-bottom: 20px; }
.ma-rule { flex: 1; height: .5px; background: var(--ma-rule); }
.ma-h2 { font-family: var(--ma-display); font-weight: 300; font-size: clamp(52px,8vw,80px); line-height: 1.0; letter-spacing: -0.025em; margin: 0 0 28px; }
.ma-h2 em { font-style: italic; color: var(--ma-accent); }
.ma-lede { font-family: var(--ma-display); font-style: italic; font-size: 20px; line-height: 1.5; color: var(--ma-ink-soft); margin: 0 0 56px; }
.ma-empty { margin-top: 80px; text-align: center; font-family: var(--ma-mono); font-size: 12px; color: var(--ma-ink-faint); letter-spacing: .08em; text-transform: uppercase; }
.ma-empty-glyph { font-size: 48px; margin-bottom: 16px; opacity: .25; }
@media (max-width: 600px) { .ma-nav { padding: 16px 20px; } .ma-page { padding: 32px 20px 60px; } }
  </style>
</head>
<body>

      </div>
    </div>
  </div>
  <a class="ma-cv-pill" href="../CV.pdf" target="_blank">CV ↗</a>
</nav>
<main class="ma-page">

    <span>creative · food</span>
    <span class="ma-rule"></span>
    <span>Gyaneshwar Agrahari</span>
  </div>
  <h2 class="ma-h2">Fo<em>od</em></h2>

    <div class="ma-empty-glyph">◈</div>
    <p>Food posts coming soon.</p>
  </div>
</main>
<script>
(function() {
  var drop = document.querySelector('.ma-nav-drop');
  if (!drop) return;
  drop.querySelector('span').addEventListener('click', function(e) {
    drop.classList.toggle('open');
    e.stopPropagation();
  });
  document.addEventListener('click', function() { drop.classList.remove('open'); });
})();
</script>
</body>
</html>
